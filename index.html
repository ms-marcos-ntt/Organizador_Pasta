<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Organizador de Downloads</title></head>
<body>
  <h1>Organizador de Downloads</h1>
  <pre id="terminal" style="background:#000;color:#0f0;padding:10px;height:300px;overflow:auto;"></pre>
  <script>
    const terminal = document.getElementById("terminal");
    window.electronAPI.onLog((msg) => {
      terminal.textContent += msg + "\n";
      terminal.scrollTop = terminal.scrollHeight;
    });
  </script>
</body>
</html>
