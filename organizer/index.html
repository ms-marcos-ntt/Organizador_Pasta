<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizador de Downloads</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", system-ui, sans-serif; --bg: #0b1120; --panel: rgba(18, 28, 49, .86); --line: rgba(148, 163, 184, .16); --text: #e5edf8; --muted: #8fa2bd; --blue: #60a5fa; --green: #4ade80; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 360px; min-height: 100vh; color: var(--text); background: radial-gradient(circle at 10% 0%, #172b51 0, transparent 38%), var(--bg); }
    .app { width: min(100%, 980px); margin: 0 auto; padding: 24px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
    .eyebrow { margin: 0 0 7px; color: var(--blue); font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); letter-spacing: -.04em; }
    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
    .pulse { display: inline-flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid rgba(74, 222, 128, .22); border-radius: 999px; color: #bbf7d0; background: rgba(34, 197, 94, .1); font-size: 12px; white-space: nowrap; }
    .pulse::before { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 5px rgba(74, 222, 128, .12); content: ""; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
    .card, .logs-card { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: 0 18px 45px rgba(0,0,0,.16); backdrop-filter: blur(12px); }
    .card { padding: 16px; }
    .card-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    .card-value { display: block; margin-top: 7px; color: var(--text); font-size: 25px; font-weight: 700; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; padding: 15px 16px; border-bottom: 1px solid var(--line); }
    button, select { border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; color: var(--text); background: #182640; font: inherit; font-size: 12px; cursor: pointer; }
    button:hover { border-color: rgba(96, 165, 250, .65); background: #203457; }
    button.primary { border-color: rgba(96, 165, 250, .35); background: #2563a8; }
    .filter-label { margin-left: auto; color: var(--muted); font-size: 12px; }
    #terminal { height: min(52vh, 440px); margin: 0; padding: 17px; overflow: auto; border-radius: 0 0 16px 16px; background: rgba(3, 8, 20, .72); white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.65 "Cascadia Code", Consolas, monospace; }
    .line { display: block; padding: 2px 0; }
    .line.error { color: #fecdd3; }
    .line.warn { color: #fde68a; }
    .line.info { color: #cbd5e1; }
    .empty, footer { color: var(--muted); }
    footer { margin-top: 12px; font-size: 11px; }
    @media (max-width: 620px) { .app { padding: 16px; } header { display: block; } .pulse { margin-top: 16px; } .stats { grid-template-columns: 1fr; } .filter-label { width: 100%; margin-left: 0; } #terminal { height: 48vh; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div><p class="eyebrow">Monitoramento ativo</p><h1>Organizador de Downloads</h1><p class="subtitle">Arquivos antigos são separados automaticamente por tipo.</p></div>
      <span class="pulse">Monitorando a cada 10 min</span>
    </header>
    <section class="stats" aria-label="Resumo dos logs">
      <div class="card"><span class="card-label">Registros</span><strong class="card-value" id="total">0</strong></div>
      <div class="card"><span class="card-label">Movimentados</span><strong class="card-value" id="moved">0</strong></div>
      <div class="card"><span class="card-label">Erros</span><strong class="card-value" id="errors">0</strong></div>
    </section>
    <section class="logs-card">
      <div class="toolbar"><button class="primary" id="copy">Copiar debug</button><button id="clear">Limpar tela</button><label class="filter-label" for="filter">Exibir:</label><select id="filter"><option value="ALL">Todos</option><option value="INFO">Informações</option><option value="ERROR">Erros</option></select></div>
      <div id="terminal" aria-label="Logs de diagnóstico"><span class="empty">Aguardando eventos...</span></div>
    </section>
    <footer id="status">O aplicativo está pronto.</footer>
  </main>
  <script>
    const terminal = document.getElementById("terminal"), status = document.getElementById("status"), filter = document.getElementById("filter"), logs = [];
    function escapeHtml(value) { return value.replace(/[&<>"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[char])); }
    function render() { const selected = filter.value, visible = logs.filter((item) => selected === "ALL" || item.nivel === selected); terminal.innerHTML = visible.length ? visible.map((item) => `<span class="line ${item.nivel.toLowerCase()}">${escapeHtml(item.linha)}</span>`).join("") : '<span class="empty">Nenhum registro para este filtro.</span>'; terminal.scrollTop = terminal.scrollHeight; }
    function adicionarLog(evento) { const nivel = evento.nivel || "INFO", linha = `[${evento.timestamp || new Date().toISOString()}] [${nivel}] ${evento.mensagem}`; logs.push({ nivel, linha }); document.getElementById("total").textContent = logs.length; document.getElementById("moved").textContent = logs.filter((item) => item.linha.includes("Movido:") || item.linha.includes("Movido entre volumes:")).length; document.getElementById("errors").textContent = logs.filter((item) => item.nivel === "ERROR").length; status.textContent = `${logs.length} registro(s) — último evento: ${nivel}`; render(); }
    filter.addEventListener("change", render);
    window.electronAPI.onLog(adicionarLog);
    document.getElementById("copy").addEventListener("click", async () => { await navigator.clipboard.writeText(logs.map((item) => item.linha).join("\n")); status.textContent = "Debug copiado para a área de transferência."; });
    document.getElementById("clear").addEventListener("click", () => { logs.length = 0; document.getElementById("total").textContent = "0"; document.getElementById("moved").textContent = "0"; document.getElementById("errors").textContent = "0"; status.textContent = "Tela limpa — novos eventos continuarão sendo salvos."; render(); });
  </script>
</body>
</html>
